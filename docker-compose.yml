services:
  seatbooking:
    build: .
    image: seatbookingapp:latest
    container_name: seatbooking
    restart: unless-stopped

    # Bind to loopback only — put nginx/Caddy in front for TLS. NEXTAUTH_URL must always be set to
    # the real public URL in .env.local (an empty value crashes next-auth/react on every page —
    # its client-side URL parsing doesn't tolerate an unset origin the way the server side does).
    ports:
      - "127.0.0.1:3000:3000"

    # Secrets stay out of the image and out of git (.env.local is gitignored).
    env_file:
      - .env.local

    # The database is the only mutable state. Keeping it in a named volume means `docker compose
    # up --build` ships new code without touching live bookings.
    volumes:
      - seatbooking-data:/data

    # Single instance only: SQLite plus in-process caches (seatRoundsCache, attendanceCache,
    # poolCache). Do not scale this service above 1 replica.
    deploy:
      replicas: 1

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # Joins the existing Nginx reverse proxy's network so it can reach this container directly
    # by service name, instead of only through the 127.0.0.1 port binding above.
    networks:
      - n8nnet

volumes:
  seatbooking-data:

# n8nnet already exists on the host, created by another stack -- declared external so Compose
# attaches to it instead of trying to create its own network of the same name. Nothing about this
# app depends on n8n itself; it's just the network the reverse-proxy container happens to be on.
networks:
  n8nnet:
    external: true
